<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharaohs’ Quest – رحلة الفراعنة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Marcellus&display=swap">
<style>
:root{--bg:#eceeed;--card:#fbfbf8;--ink:#14233b;--mut:#566175;--lap:#13294d;--lapt:#fff;--tq:#17786f;--gold:#b98a1f;--ok:#26734a;--bad:#a8382b;--line:#d3d8d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1628;--card:#142340;--ink:#eee8d8;--mut:#a3aec4;--lap:#e1b955;--lapt:#101a2e;--tq:#4fc3b6;--gold:#e1b955;--ok:#5fcf93;--bad:#ff8d7d;--line:#27395c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1628;--card:#142340;--ink:#eee8d8;--mut:#a3aec4;--lap:#e1b955;--lapt:#101a2e;--tq:#4fc3b6;--gold:#e1b955;--ok:#5fcf93;--bad:#ff8d7d;--line:#27395c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Cairo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:Marcellus,Cairo,Georgia,serif;font-weight:700;line-height:1.3;margin:0 0 .5rem}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:.4rem 0}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}.bar .sp{flex:1}
.pts{background:var(--lap);color:var(--lapt);border-radius:99px;padding:3px 14px;font-weight:700;font-size:.9rem}
.lang{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.dots{display:flex;gap:6px;margin-bottom:16px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--tq)}
.hero{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}.hero svg{width:30%;max-width:120px}
.cart{border:2px solid var(--gold);border-radius:56px;padding:26px 28px;background:var(--card);text-align:center;margin:10px 0 16px;box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6.5px var(--gold)}
.cart p{font-size:1.12rem;line-height:1.7;margin:0}
.tag{display:inline-block;color:var(--tq);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--lap);color:var(--lapt);margin-top:10px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:9px;font:inherit;cursor:pointer}
.opt svg{width:46px;flex:none}.opt .em{font-size:1.6rem;width:46px;text-align:center;flex:none}
button:hover{filter:brightness(1.06)}button:focus-visible,label:focus-within{outline:3px solid var(--tq);outline-offset:2px}
.hintbox{border-inline-start:4px solid var(--gold);padding:8px 12px;margin-top:10px;background:var(--card);border-radius:10px}
.msg{color:var(--bad);font-weight:700;margin-top:10px}.ok{color:var(--ok);font-weight:700}
.badge{font-size:2.2rem;line-height:1}
.steps{margin:0;padding-inline-start:1.3rem}.steps li{margin:.25rem 0}
.note{color:var(--mut);font-size:.85rem;margin-top:16px}
.big{font-family:Marcellus,Cairo,serif;font-size:2.2rem;font-weight:700;color:var(--gold);line-height:1.2}
.res{width:100%;border-radius:14px;display:block;margin:10px 0}.port{width:200px;margin:8px auto;display:block}
.rw{display:flex;align-items:center;gap:12px;margin-top:10px}.rw .em{font-size:1.8rem}.rw div{flex:1}.rw .btn{width:auto;margin:0;padding:8px 14px}
.logos{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px}.logos img{height:60px;width:auto;max-width:32%;object-fit:contain}.logos img:nth-child(2){height:72px}
.banner{background:linear-gradient(160deg,#13294d,#1f4a7a);border-radius:18px;padding:18px 14px 16px;text-align:center;margin-bottom:12px}.banner h1{color:#f3e3b2;margin:8px 0 4px}.banner p{color:#dfe6f2;margin:0}.banner .hero{margin-top:0}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:.88rem;line-height:1.7}.foot b{display:block;color:var(--ink);font-size:1rem}
.adj{display:block;margin-top:10px;font-size:.9rem}.adj input{width:100%}
.file{display:block;text-align:center;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--lap);color:var(--lapt);margin-top:10px}.file input{position:absolute;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<main id="app"></main>

const T={ar:{title:"رحلة الفراعنة",sub:"تطبيق تفاعلي لاكتشاف الآثار بالألغاز والنقاط · المتحف المصري الكبير (نموذج تجريبي)",pH:"المشكلة",p:"رغم المكانة العالمية للمتحف المصري الكبير وثراء مقتنياته، تظل زيارة كثيرين مقتصرة على المرور السريع أمام القطع الشهيرة والتقاط الصور، دون تفاعل حقيقي أو ارتباط عاطفي بالمحتوى. وهذا يُضعف الاستمتاع والتعلّم والرضا، ويقلّل رغبة الزائر في تكرار الزيارة أو التوصية بها، ويُكدّس الزوار حول عدد محدود من القطع بينما تقل زيارة بقية القاعات.",iH:"الفكرة",i:"ألغاز عن الملوك، وكل لغز يقودك إلى عدة آثار للملك نفسه في القاعات. تؤكد وصولك وتجمع النقاط والشارات وتبدلها بجوائز، ثم تكتشف أي فرعون يشبهك وترى نفسك في صورة ملكية.",hH:"كيف تلعب؟",zoom:"تكبير الوجه",shift:"تحريك الوجه لأعلى/لأسفل",by:"إعداد الباحث: مصطفى محمود أحمد إبراهيم",aff:"معيد بكلية تكنولوجيا الخدمات الفندقية والسياحية · جامعة شرق بورسعيد التكنولوجية",st:["اقرأ اللغز","ابحث عن 3 آثار لنفس الملك وأكّد وصولك لكل أثر","اجمع النقاط والشارات وبدّلها بجوائز","اكتشف شخصيتك الفرعونية وشاهد صورتك الملكية"],go:"ابدأ الرحلة",pts:"نقطة",rid:"اللغز",stg:"المرحلة",of:"من",hint:"تلميح (−20 نقطة)",hl:"تلميح:",found:"وجدتها – أكّد الوصول",cH:"أي قطعة تقف أمامها؟",cP:"في المتحف تمسح رمز QR بجانب القطعة. هنا اختر القطعة التي وجدتها.",bad:"ليست هذه القطعة. أعد قراءة اللغز وحاول مرة أخرى.",ok:"تم تأكيد الوصول! +100 نقطة",kdone:"أكملت اللغز! +50 نقطة مكافأة",bd:"الشارة:",nx:"اللغز التالي",fin:"اكتشف شخصيتك",qH:"أي فرعون أنت؟",ph:"شاهد نفسك كفرعون",phP:"معاينة تقريبية لميزة الصورة الملكية بالذكاء الاصطناعي (محاكاة): وجهك على جسد الفرعون الذي اخترته. تُعالج الصورة على جهازك فقط ولا تُرفع ولا تُحفظ. النسخة النهائية تستخدم نموذجًا حقيقيًا لتوليد الصور بعد موافقتك.",pick:"اختر أو التقط صورة",skip:"تخطّ وأرني النتيجة",you:"أنت",save:"اضغط مطولًا على الصورة لحفظها.",sh:"شارك النتيجة",again:"ابدأ من جديد",score:"نتيجتك",fine:"نموذج بحثي: القطع عينات وتأكيد الوصول محاكى. المطابقة والصورة الملكية محاكاة ترفيهية وليست تحليلًا علميًا للوجه، ولا تُجمع أي بيانات.",copied:"تم نسخ النتيجة",tx:"أنا {n} في رحلة الفراعنة! نتيجتي {s} نقطة.",tog:"EN",rwH:"الجوائز",rwP:"بدّل نقاطك بجوائز. الجوائز مقترحة وتحتاج اتفاقًا مع إدارة المتحف، والأكواد هنا للتجربة فقط.",red:"استبدل",code:"الكود:",mine:"جوائزك",back:"رجوع",
q:[{q:"أي وصف أقرب لك؟",o:["أقود حين لا يتوقع أحد","فضولي ولا أخاف المغامرة","أبني ما يدوم طويلًا"]},{q:"إجازتك المثالية؟",o:["أقود مشروعًا كبيرًا","أستكشف مكانًا جديدًا","أصنع شيئًا لا يُنسى"]}]},
en:{title:"Pharaohs’ Quest",sub:"A gamified artifact-discovery app · Grand Egyptian Museum (prototype)",pH:"The problem",p:"Despite the Grand Egyptian Museum’s global standing and the richness of its collection, many visits stay limited to a quick walk past the best-known objects and a few photos, with little real interaction or emotional connection to the content. This weakens enjoyment, learning and satisfaction, lowers the visitor’s intention to return or recommend the museum, and crowds visitors around a few famous pieces while other galleries stay quiet.",iH:"The idea",i:"Riddles about kings, each leading you to several artifacts of the same king in the galleries. Check in, earn points and badges, redeem them for rewards, then discover which pharaoh you resemble and see yourself in a royal portrait.",hH:"How to play",zoom:"Zoom face",shift:"Move face up/down",by:"Prepared by: Mostafa Mahmoud Ahmed Ibrahim",aff:"Teaching Assistant, Faculty of Hotel and Tourism Services Technology · East Port Said University of Technology",st:["Read the riddle","Find 3 artifacts of the same king and check in at each","Earn points and badges and redeem them for rewards","Discover your pharaoh and see your royal portrait"],go:"Start the quest",pts:"points",rid:"Riddle",stg:"Stage",of:"of",hint:"Hint (−20 points)",hl:"Hint:",found:"I found it – check in",cH:"Which object are you standing next to?",cP:"In the museum you scan the QR code beside the object. Here, choose the one you found.",bad:"Not this one. Reread the riddle and try again.",ok:"Checked in! +100 points",kdone:"Riddle complete! +50 bonus points",bd:"Badge:",nx:"Next riddle",fin:"Discover your pharaoh",qH:"Which pharaoh are you?",ph:"See yourself as a pharaoh",phP:"A simulated preview of the AI royal-portrait feature: your face on the body of the pharaoh you matched. The photo is processed on your device only and is never uploaded or stored. The final version would use a real image-generation model, with your consent.",pick:"Choose or take a photo",skip:"Skip and show my result",you:"You are",save:"Press and hold the image to save it.",sh:"Share my result",again:"Play again",score:"Your score",fine:"Research prototype: sample artifacts, simulated check-in. The match and the royal portrait are entertainment simulations, not a scientific face analysis, and no data is collected.",copied:"Result copied",tx:"I’m {n} in Pharaohs’ Quest! I scored {s} points.",tog:"العربية",rwH:"Rewards",rwP:"Redeem your points for rewards. Rewards are proposals that need agreement with museum management, and codes here are for demo only.",red:"Redeem",code:"Code:",mine:"Your rewards",back:"Back",

function pt(i,c){const[a,b]=K[i].c;return `<svg viewBox="0 0 120 140" class="${c||""}" aria-hidden="true"><rect width="120" height="140" rx="14" fill="#13294d"/><path d="M16 140L26 50Q60-4 94 50L104 140Z" fill="${a}"/><path d="M34 62L30 140M46 52L42 140M74 52L78 140M86 62L90 140" stroke="${b}" stroke-width="3" opacity=".8"/><ellipse cx="60" cy="68" rx="22" ry="28" fill="#c99560"/><path d="M38 54Q60 40 82 54" stroke="${b}" stroke-width="5" fill="none"/>${K[i].cr}<path d="M45 68h11M64 68h11" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/><path d="M60 70v10l-4 2M53 90q7 4 14 0" stroke="#7a4a25" stroke-width="2" fill="none"/><rect x="56" y="98" width="8" height="16" rx="2" fill="${b}"/><path d="M22 140Q60 98 98 140Z" fill="${b}"/><path d="M34 140Q60 114 86 140" stroke="#1f8a8a" stroke-width="5" fill="none"/></svg>`}
function init(l){s={lang:l||s.lang,ki:0,si:0,sc:0,h:0,st:"intro",msg:"",good:"",opts:[],qi:0,tl:[0,0,0],img:"",cv:null,kr:0,cp:[],back:"intro"};draw()}
function hdr(){const d=s.st==="q"||s.st==="photo"||s.st==="res"?3:s.ki+(s.st==="rew"?1:0);return `<div class="bar"><button class="lang" onclick="tog()">${t("tog")}</button><button class="lang" onclick="openRw()">🎁 ${t("rwH")}</button><span class="sp"></span><span class="pts" aria-live="polite">${s.sc} ${t("pts")}</span></div><div class="dots" aria-hidden="true">${K.map((_,j)=>`<i class="${j<d?"on":""}"></i>`).join("")}</div>`}
function draw(){document.documentElement.lang=s.lang;document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";let h;
if(s.st==="intro")h=`<div class="bar"><button class="lang" onclick="tog()">${t("tog")}</button></div><div class="logos">${LG.map(x=>`<img src="${x}" alt="">`).join("")}</div><div class="banner"><div class="hero">${pt(0)+pt(1)+pt(2)}</div><h1>${t("title")}</h1><p>${t("sub")}</p></div><div class="card"><h3>${t("pH")}</h3><p>${t("p")}</p></div><div class="card"><h3>${t("iH")}</h3><p>${t("i")}</p></div><div class="card"><h3>${t("hH")}</h3><ol class="steps">${t("st").map(x=>`<li>${x}</li>`).join("")}</ol></div><button class="btn" onclick="go()">${t("go")}</button><p class="note">${t("fine")}</p>`;
else if(s.st==="ch"){const c=cur();h=hdr()+`<span class="tag">${t("rid")} ${s.ki+1} ${t("of")} 3 · ${t("stg")} ${s.si+1} ${t("of")} 3</span>${s.good?`<p class="ok">${s.good}</p>`:""}<div class="cart"><p>${c.c}</p></div>${s.h?`<div class="hintbox"><b>${t("hl")}</b> ${c.h}</div>`:`<button class="btn alt" onclick="hint()">${t("hint")}</button>`}<button class="btn" onclick="chk()">${t("found")}</button>`}
else if(s.st==="chk")h=hdr()+`<h2>${t("cH")}</h2><p>${t("cP")}</p>${s.opts.map(id=>{const a=K[id/3|0].S[id%3];return `<button class="opt" onclick="pickObj(${id})"><span class="em">${a.e}</span><b>${a[s.lang].n}</b></button>`}).join("")}${s.msg?`<p class="msg">${s.msg}</p>`:""}`;
else if(s.st==="rew"){const c=k(s.ki);h=hdr()+`<div class="card"><p class="ok">${t("ok")}</p><p class="ok">${t("kdone")}</p>${pt(s.ki,"port")}<h3>${c.n}</h3><div class="badge">${K[s.ki].e}</div><p><b>${t("bd")}</b> ${c.n}</p><p>${c.story}</p></div><button class="btn" onclick="nx()">${s.ki<2?t("nx"):t("fin")}</button>`}
else if(s.st==="q"){const m=t("q")[s.qi];h=hdr()+`<h2>${t("qH")}</h2><p class="tag">${s.qi+1} ${t("of")} 2</p><h3>${m.q}</h3>${m.o.map((o,x)=>`<button class="opt" onclick="pickQ(${x})">${o}</button>`).join("")}`}
else if(s.st==="photo")h=hdr()+`<h2>${t("ph")}</h2><div class="hero">${pt(s.kr)}</div><p>${t("phP")}</p><label class="file">${t("pick")}<input type="file" accept="image/*" capture="user" onchange="photo(this)"></label><button class="btn alt" onclick="s.st='res';draw()">${t("skip")}</button>`;
else if(s.st==="rw")h=`<div class="bar"><button class="lang" onclick="closeRw()">← ${t("back")}</button><span class="sp"></span><span class="pts">${s.sc} ${t("pts")}</span></div><h2>🎁 ${t("rwH")}</h2><p>${t("rwP")}</p>${R.map((r,x)=>`<div class="card rw"><span class="em">${r.e}</span><div><b>${r[s.lang]}</b><br>${r.c} ${t("pts")}</div><button class="btn" ${s.sc<r.c?"disabled":""} onclick="redeem(${x})">${t("red")}</button></div>`).join("")}${s.cp.length?`<h3>${t("mine")}</h3>${s.cp.map(p=>`<div class="card">${R[p.x].e} ${R[p.x][s.lang]}<br><b>${t("code")} ${p.code}</b></div>`).join("")}`:""}`;
else{const n=k(s.kr).n;h=hdr()+`<p>${t("you")}</p><div class="big">${n}</div><p>${k(s.kr).d}</p>${s.img?`<img class="res" src="${s.img}" alt="${n}">`:pt(s.kr,"port")}${s.im?`<label class="adj">${t("zoom")}<input id="zm" type="range" min="80" max="260" value="${s.zm*100}" oninput="adj()"></label><label class="adj">${t("shift")}<input id="dy" type="range" min="-90" max="90" value="${s.dy}" oninput="adj()"></label>`:""}<p class="note">${s.img?t("save"):""}</p><p><b>${t("score")}:</b> ${s.sc} / 1050</p><button class="btn" onclick="share()">${t("sh")}</button><button class="btn alt" onclick="openRw()">🎁 ${t("rwH")}</button><button class="btn alt" onclick="init()">${t("again")}</button><p class="note">${t("fine")}</p>`}
